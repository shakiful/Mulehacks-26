# Persistent SQLite requires paid compute plus a disk. Review Render's costs before creating.
services:
  - type: web
    name: connecthub-api
    runtime: python
    branch: production
    plan: starter
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.deploy
    healthCheckPath: /api/health
    disk:
      name: connecthub-data
      mountPath: /var/data/connecthub
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/connecthub/connecthub.db
      - key: CORS_ORIGINS
        sync: false
      - key: RAFI_LOGIN_PASSWORD
        sync: false
      - key: AFSANA_LOGIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_LIFETIME_SECONDS
        value: "43200"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_TIMEOUT_SECONDS
        value: "18"
      - key: AI_FALLBACK_ENABLED
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: EMBEDDING_TIMEOUT_SECONDS
        value: "8"
      - key: SEED_TIMEZONE
        value: America/Chicago
